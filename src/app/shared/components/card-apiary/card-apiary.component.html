<div class="card hover:shadow-honey transition-all duration-300">
  <div class="flex items-start justify-between mb-4">
    <div class="flex-1">
      <h3 class="font-semibold text-neutral-900 text-lg mb-1">{{ apiary.name }}</h3>
      <p class="text-sm text-neutral-500">{{ apiary.location.address }}</p>
    </div>
    <div 
      class="w-10 h-10 rounded-lg flex items-center justify-center text-2xl"
      [class.bg-success]="apiary.status === 'healthy'"
      [class.bg-warning]="apiary.status === 'warning'"
      [class.bg-error]="apiary.status === 'critical'">
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-3 gap-4 mb-4">
    <div class="text-center p-3 bg-honey-50 rounded-lg">
      <p class="text-2xl font-bold text-honey-700">{{ apiary.hivesCount }}</p>
      <p class="text-xs text-neutral-600 mt-1">Total Hives</p>
    </div>
    
    <div class="text-center p-3 bg-success-light rounded-lg">
      <p class="text-2xl font-bold text-success-dark">{{ apiary.activeHives }}</p>
      <p class="text-xs text-neutral-600 mt-1">Active</p>
    </div>
    
    <div class="text-center p-3 bg-info-light rounded-lg">
      <p class="text-2xl font-bold text-info-dark">{{ apiary.totalWeight }}</p>
      <p class="text-xs text-neutral-600 mt-1">Total kg</p>
    </div>
  </div>

  <!-- Location -->
  <div class="flex items-center gap-2 text-sm text-neutral-600 pt-3 border-t border-neutral-100">
    <span>{{ apiary.location.lat.toFixed(4) }}, {{ apiary.location.lng.toFixed(4) }}</span>
  </div>

  <!-- Last update -->
  <div class="mt-3">
    <p class="text-xs text-neutral-400">
      Last update: {{ apiary.lastUpdate | date:'short' }}
    </p>
  </div>
</div>
