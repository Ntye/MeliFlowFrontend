<div class="card hover:shadow-honey transition-all duration-300">
  <div class="flex items-start justify-between">
    <div class="flex-1">
      <p class="text-sm text-neutral-500 mb-2">{{ data.label }}</p>
      <p class="text-3xl font-bold text-neutral-900 mb-2">{{ data.value }}</p>
      
      @if (data.trend) {
        <div class="flex items-center gap-1 text-sm">
          @if (data.trend.direction === 'up') {
            <span class="text-success">↑ {{ data.trend.value }}%</span>
          } @else {
            <span class="text-error">↓ {{ data.trend.value }}%</span>
          }
          <span class="text-neutral-400">vs last period</span>
        </div>
      }
    </div>
    
    @if (data.icon) {
      <div 
        class="w-12 h-12 rounded-lg flex items-center justify-center text-2xl"
        [style.background-color]="data.color || '#FDF4E6'">
        {{ data.icon }}
      </div>
    }
  </div>
</div>
