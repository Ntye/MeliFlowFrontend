<div 
  (click)="onClick()"
  class="card card-hover cursor-pointer">
  
  <!-- Header with name and status -->
  <div class="flex items-start justify-between mb-4">
    <div class="flex items-center gap-3">
      <div>
        <h3 class="text-lg font-semibold text-neutral-900">{{ hive.name }}</h3>
        <p class="text-xs text-neutral-500">ID: {{ hive.id }}</p>
      </div>
    </div>
    <span 
      class="badge"
      [ngClass]="getStatusBadgeClass(hive.status)">
      {{ hive.status }}
    </span>
  </div>

  <!-- Metrics -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="flex items-center gap-2">
      <div>
        <p class="text-xs text-neutral-500">Weight</p>
        <p class="font-semibold text-neutral-900">{{ hive.weight }} kg</p>
      </div>
    </div>
    
    @if (hive.temperature) {
      <div class="flex items-center gap-2">
        <div>
          <p class="text-xs text-neutral-500">Temperature</p>
          <p class="font-semibold text-neutral-900">{{ hive.temperature }}°C</p>
        </div>
      </div>
    }
  </div>

  <!-- Status indicators -->
  <div class="flex items-center gap-4 pt-4 border-t border-neutral-100">
    <div class="flex items-center gap-2 flex-1">
      <div class="flex-1">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-neutral-500">Battery</span>
          <span class="text-xs font-medium">{{ hive.batteryLevel }}%</span>
        </div>
        <div class="w-full bg-neutral-200 rounded-full h-2">
          <div 
            class="h-2 rounded-full transition-all"
            [style.width.%]="hive.batteryLevel"
            [style.background-color]="hive.batteryLevel > 20 ? '#10B981' : '#EF4444'">
          </div>
        </div>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <div>
        <p class="text-xs text-neutral-500">Signal</p>
        <p class="text-xs font-medium">{{ hive.signalStrength }}%</p>
      </div>
    </div>
  </div>

  <!-- Last update -->
  <div class="mt-3 pt-3 border-t border-neutral-100">
    <p class="text-xs text-neutral-400">
      Last update: {{ hive.lastUpdate | date:'short' }}
    </p>
  </div>
</div>
