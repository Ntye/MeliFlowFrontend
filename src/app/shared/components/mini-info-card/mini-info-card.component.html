<div class="flex items-center gap-3 p-4 rounded-lg border border-neutral-100 bg-white">
  @if (icon) {
    <div 
      class="w-10 h-10 rounded-lg flex items-center justify-center text-xl flex-shrink-0"
      [style.background-color]="color">
      {{ icon }}
    </div>
  }
  <div class="flex-1 min-w-0">
    <p class="text-xs text-neutral-500 mb-1">{{ label }}</p>
    <p class="text-lg font-semibold text-neutral-900 truncate">{{ value }}</p>
  </div>
</div>
