<div class="chart-container">
  @if (title) {
    <h3 class="text-lg font-semibold text-neutral-900 mb-4">{{ title }}</h3>
  }
  <div 
    class="chart-canvas bg-neutral-50 rounded-lg flex items-center justify-center text-neutral-400"
    [style.height]="height">
    <div class="text-center">
      <p class="text-lg">📊</p>
      <p class="text-sm">Chart placeholder</p>
      <p class="text-xs mt-2">Chart.js integration pending</p>
    </div>
  </div>
</div>
