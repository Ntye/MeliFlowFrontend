<div class="overflow-x-auto rounded-xl border border-neutral-200">
  <table class="w-full border-separate border-spacing-0">
    <thead class="bg-neutral-50 border-b border-neutral-200">
      <tr>
        @for (column of columns; track column.key) {
          <th 
            class="px-6 py-3 text-left text-xs font-semibold text-neutral-600 uppercase tracking-wider"
            [style.width]="column.width">
            {{ column.label }}
          </th>
        }
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-neutral-100">
      @for (row of data; track $index) {
        <tr 
          (click)="onRowClick(row)"
          [class.hover:bg-honey-50]="hoverable"
          [class.cursor-pointer]="hoverable"
          class="transition-colors duration-150">
          @for (column of columns; track column.key) {
            <td class="px-6 py-4 text-sm text-neutral-900">
              {{ row[column.key] }}
            </td>
          }
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="columns.length" class="px-6 py-8 text-center text-neutral-500">
            No data available
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
