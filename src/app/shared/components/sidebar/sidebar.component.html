<!-- Desktop Sidebar -->
<aside class="h-screen bg-white border-r border-neutral-200 transition-all duration-300 z-40">


    <!-- Logo/Header -->
    <div class="h-20 flex items-center justify-between px-6 border-b border-neutral-100 flex-shrink-0">
        @if (!isCollapsed()) {
            <div class="flex items-center gap-3">
                <span class="font-display font-bold text-xl text-gradient">MeliFlow</span>
            </div>
        }
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
        @for (item of navItems; track item.route) {
            <a
                    [routerLink]="item.route"
                    routerLinkActive="bg-honey-50 text-honey-700 font-medium"
                    class="flex items-center gap-4 px-4 py-3 rounded-xl text-neutral-500 hover:bg-honey-50 hover:text-honey-600 transition-all duration-200 group relative"
                    [class.justify-center]="isCollapsed()">
                @if (!isCollapsed()) {
                    <span class="font-medium">{{ item.label }}</span>
                }

                <!-- Tooltip for collapsed state -->
                @if (isCollapsed()) {
                    <div class="absolute left-16 bg-neutral-800 text-white px-3 py-2 rounded-lg text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">
                        {{ item.label }}
                    </div>
                }
            </a>
        }
    </nav>

    <!-- Footer actions -->
    <div class="p-4 border-t border-neutral-100 mt-auto">
        <button
                (click)="toggleSidebar()"
                class="w-full flex items-center px-4 py-3 rounded-xl text-neutral-500 hover:bg-neutral-50 hover:text-neutral-700 transition-all duration-200"
                [class.justify-center]="isCollapsed()">
            @if (isCollapsed()) {
                <span class="font-medium">Agrandir</span>
            } @else {
                <span class="font-medium">Réduire</span>
            }
        </button>
    </div>
</aside>

<!-- Mobile Bottom Navbar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-neutral-200 z-50 px-4 py-2 flex justify-between items-center shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
    @for (item of navItems; track item.route) {
        <a
                [routerLink]="item.route"
                routerLinkActive="text-honey-600"
                class="flex flex-col items-center justify-center p-2 text-neutral-400 hover:text-honey-500 transition-colors">
            <span class="text-[10px] font-medium">{{ item.label }}</span>
        </a>
    }
</nav>
